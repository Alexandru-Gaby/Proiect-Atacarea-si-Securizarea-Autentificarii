{% extends 'base.html' %}
{% block title %}Resetare parolă{% endblock %}
{% block content %}
<div class="card">
    <h2>Ai uitat parola?</h2>
    <form method="POST" action="/forgot-password">
        <label>Email-ul contului tău:</label>
        <input type="email" name="email" required placeholder="ex: user@yahoo.com">
        <button type="submit">Trimite token resetare</button>
    </form>
    <p><a href="{{ url_for('login') }}">Înapoi la login</a></p>
</div>
{% endblock %}
